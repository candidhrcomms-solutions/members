<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .form-input{
      width:100%;
      padding:.75rem 1rem;
      border-radius:.75rem;
      border:1px solid #d1d5db;
      outline:none;
      transition:all .2s ease;
      background:white;
    }
    .form-input:focus{ box-shadow:0 0 0 2px #2563eb; border-color:transparent; }
    .loader { border-top-color:#2563eb; animation: spinner 1s linear infinite; }
    @keyframes spinner { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  </style>
</head>

<body class="bg-slate-50 min-h-screen py-12 px-4">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-blue-900 px-8 py-8 text-white text-center">
      <h1 class="text-2xl font-bold uppercase tracking-wider">Member Registration</h1>
      <p class="text-blue-200 mt-2 font-light">Submit member details for cover onboarding</p>
    </div>

    <form id="memberForm" class="p-8 space-y-6">

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Main Member *</label>
        <input type="text" name="mainMember" required class="form-input" placeholder="Main member name (principal)" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Member Name *</label>
        <input type="text" name="memberName" required class="form-input" placeholder="Member to register" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Date of Birth *</label>
          <input type="date" name="dob" required class="form-input" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Relationship *</label>
          <select name="relationship" required class="form-input">
            <option value="">Select</option>
            <option value="Self">Self</option>
            <option value="Spouse">Spouse</option>
            <option value="Child">Child</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Gender *</label>
          <select name="gender" required class="form-input">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Phone *</label>
          <input type="tel" name="phone" required class="form-input" placeholder="0712345678" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Email *</label>
        <input type="email" name="email" required class="form-input" placeholder="email@example.com" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Cover Option *</label>
        <select name="cover" required class="form-input">
          <option value="">Select cover</option>
          <option value="200K Outpatient & 1M Inpatient">200K Outpatient & 1M Inpatient</option>
          <option value="300K Outpatient & 2M Inpatient">300K Outpatient & 2M Inpatient</option>
        </select>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3">
        <span id="btnText">Submit</span>
        <div id="btnLoader" class="hidden loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5"></div>
      </button>

    </form>

    <div id="messageBox" class="hidden mx-8 mb-8 p-4 rounded-lg text-center font-medium"></div>
  </div>

  <script>
    // ✅ Put your web app /exec URL here
    const SCRIPT_URL = "PUT_YOUR_WEB_APP_EXEC_URL_HERE";

    const form = document.getElementById("memberForm");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnLoader = document.getElementById("btnLoader");
    const messageBox = document.getElementById("messageBox");

    // Hidden iframe avoids CORS and ensures normal POST
    const iframe = document.createElement("iframe");
    iframe.name = "hidden_iframe";
    iframe.style.display = "none";
    document.body.appendChild(iframe);

    let awaitingResponse = false;

    iframe.addEventListener("load", () => {
      if (!awaitingResponse) return;
      awaitingResponse = false;

      showMessage("Submitted successfully.", "success");
      form.reset();

      submitBtn.disabled = false;
      btnText.textContent = "Submit";
      btnLoader.classList.add("hidden");
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      if (!SCRIPT_URL.startsWith("https://script.google.com/macros/s/") || !SCRIPT_URL.endsWith("/exec")) {
        showMessage("Invalid SCRIPT_URL. Use the Google Apps Script /exec URL.", "error");
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = "Processing...";
      btnLoader.classList.remove("hidden");
      messageBox.classList.add("hidden");

      form.action = SCRIPT_URL;
      form.method = "POST";
      form.target = "hidden_iframe";

      awaitingResponse = true;
      form.submit();

      setTimeout(() => {
        if (!awaitingResponse) return;
        awaitingResponse = false;
        submitBtn.disabled = false;
        btnText.textContent = "Submit";
        btnLoader.classList.add("hidden");
        showMessage("Submission may have been blocked. Check Apps Script → Executions for errors.", "error");
      }, 15000);
    });

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.classList.remove("hidden", "bg-green-100", "text-green-800", "bg-red-100", "text-red-800");
      if (type === "success") messageBox.classList.add("bg-green-100", "text-green-800");
      else messageBox.classList.add("bg-red-100", "text-red-800");
      messageBox.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  </script>
</body>
</html>
